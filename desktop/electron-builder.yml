appId: dev.fatup.desktop
productName: FatUp
executableName: fatup
directories:
  output: release/${version}
  buildResources: build
files:
  - out/**
  - package.json
  - "!**/*.map"
asar: true
# The window icon on Linux (taskbar / AppImage, which has no installed .desktop entry) is loaded from here.
extraResources:
  - from: build/icons/512x512.png
    to: icon.png
mac:
  target: [dmg]
  category: public.app-category.utilities
  identity: null
dmg:
  artifactName: FatUp-${version}-mac-${arch}.${ext}
win:
  target: [nsis]
  artifactName: FatUp-${version}-win-${arch}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  target: [AppImage, deb]
  category: Utility
  # A folder of NxN.png files: a lone 1024px icon lands in hicolor/1024x1024, which Ubuntu's icon theme never looks at.
  icon: icons
  executableName: fatup
  syncDesktopName: true
  maintainer: FatUp
  artifactName: FatUp-${version}-linux-${arch}.${ext}
publish:
  provider: github
  owner: ThanhPhat1080
  repo: fatup
npmRebuild: false
