name: Release

# Push a tag like v0.2.0 to build every app and attach them to a draft GitHub Release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    name: Desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --mac --arm64
          - os: windows-latest
            args: --win --x64
          - os: ubuntu-latest
            args: --linux --x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build installers (unsigned)
        working-directory: desktop
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]] || VERSION="0.0.0-dev"
          npx electron-vite build
          npx electron-builder ${{ matrix.args }} --publish never -c.extraMetadata.version="$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            desktop/release/*/*.dmg
            desktop/release/*/*.exe
            desktop/release/*/*.AppImage
            desktop/release/*/latest*.yml
            desktop/release/*/*.exe.blockmap
          if-no-files-found: error

  android:
    name: Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-37.0 build-tools;36.1.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          VERSION_NAME="${GITHUB_REF_NAME#v}"
          [[ "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]] || VERSION_NAME="0.0.0-dev"
          export VERSION_NAME
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret; the APK is signed with a throwaway debug key."
          fi
          ./gradlew --no-daemon assembleRelease
          mkdir -p ../dist
          cp app/build/outputs/apk/release/app-release.apk "../dist/FatUp-${VERSION_NAME}-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*.apk
          if-no-files-found: error

  publish:
    name: Draft release
    needs: [desktop, android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: artifacts/**/*
