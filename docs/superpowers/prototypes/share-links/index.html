<!doctype html>
<!--
  PROTOTYPE — THROWAWAY. Answers: "Chia sẻ nên hiện ở đâu trên dashboard, và form cấu hình trông thế nào?"
  Dùng CSS thật của app (desktop/src/renderer/src/styles.css) và đúng class của island, danh sách, lưới.
  Điểm cần cảm nhận:
    1. Nút "Đã chia sẻ" (màu xanh lá, cạnh nhóm Ảnh/File/Liên kết, ngăn bằng đường kẻ) lọc các file đang chia sẻ.
    2. Dòng/thẻ đang chia sẻ có icon nhiều người cạnh bút chì, không chữ. Tooltip hiện bên TRÁI nên không lệch layout.
    3. Bấm icon đó mở form cấu hình (3 biến thể A/B/C: thanh dưới cùng, phím ← →, hoặc ?variant=).
    4. "Chuyển vào Két sắt / thùng rác" một file đang chia sẻ → icon biến mất, toast báo link hết hiệu lực.
  Trang người nhận KHÔNG nằm ở đây: đó là trang Worker dựng, bạn sẽ mở link bằng trình duyệt khác khi làm xong.
  Không gọi server, không lưu gì: state nằm trong bộ nhớ. Mở bằng cách bấm đúp file này.
-->
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PROTOTYPE · Chia sẻ</title>
<link rel="stylesheet" href="../../../../desktop/src/renderer/src/styles.css" />
<style>
  body { margin: 0; background: var(--panel); color: var(--text); }
  .proto-top { padding: 8px 16px; background: var(--surface); border-bottom: 1px solid var(--border); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--warn); font-weight: 600; }
  .stage { max-width: 980px; margin: 0 auto 120px; padding: 0 12px; }
  .hint { color: var(--text-3); font-size: 12px; margin: 14px 12px 0; line-height: 1.6; }
  .kbd { font-family: ui-monospace, monospace; font-size: 12px; background: var(--surface-strong); padding: 1px 6px; border-radius: 4px; }
  .empty { text-align: center; color: var(--text-3); padding: 60px 0; }
  .g1 { background: linear-gradient(135deg, #f6b26b, #c27ba0); }
  .g2 { background: linear-gradient(135deg, #6fa8dc, #93c47d); }
  .g3 { background: linear-gradient(135deg, #8e7cc3, #6fa8dc); }
  .g4 { background: linear-gradient(135deg, #e06666, #f6b26b); }
  .g5 { background: linear-gradient(135deg, #76a5af, #6d9eeb); }
  .g6 { background: linear-gradient(135deg, #b6d7a8, #ffd966); }
  .star { opacity: .5; }
  .grid .tile__thumb { height: 150px; }
  .grid .tile__thumb > div { width: 100%; height: 100%; border-radius: 8px; }

  /* --- the new "Đã chia sẻ" filter: a different tone (green) so it reads as its own thing, set off by a divider --- */
  .chip--shared { display: inline-flex; align-items: center; gap: 6px; padding: 0 12px; flex: none; white-space: nowrap;
    color: var(--success); border-color: color-mix(in srgb, var(--success) 45%, transparent); }
  .chip--shared:hover { background: color-mix(in srgb, var(--success) 12%, transparent); }
  .chip--shared.chip--on { background: color-mix(in srgb, var(--success) 20%, var(--panel)); color: var(--success); border-color: transparent; }
  .chip--shared.chip--on:hover { background: color-mix(in srgb, var(--success) 26%, var(--panel)); filter: none; }

  /* --- the shared indicator on an item: icon only, tooltip on the LEFT (absolute, so it can never push the layout) --- */
  .share-btn { color: var(--success); flex: none; }
  [data-tip] { position: relative; }
  [data-tip]::after { content: attr(data-tip); position: absolute; right: calc(100% + 4px); top: 50%; transform: translateY(-50%);
    white-space: nowrap; background: var(--toast-bg); color: var(--toast-text); font-size: 12px; font-weight: 400; padding: 5px 9px;
    border-radius: 6px; opacity: 0; pointer-events: none; transition: opacity .12s .25s; z-index: 40; }
  [data-tip]:hover::after, [data-tip]:focus-visible::after { opacity: 1; }
  /* grid: the pencil is hover-only and floats over the end of the name, so the shared icon floats too but stays visible,
     and slides left to make room when the pencil appears. Nothing here takes space, so names never move. */
  .tile__shared { position: absolute; top: 0; right: 32px; height: 100%; display: flex; align-items: center; padding-left: 14px;
    background: linear-gradient(to right, transparent, var(--surface) 14px); z-index: 1; }
  .tile:hover .tile__shared { right: 64px; background: linear-gradient(to right, transparent, var(--surface-strong) 14px); }

  /* --- share form, shared bits --- */
  .linkbox { display: flex; gap: 8px; margin-top: 14px; }
  .linkbox input { flex: 1; min-width: 0; height: 44px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font: 13px ui-monospace, monospace; }
  .opts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .lbl { font-size: 12px; color: var(--text-2); margin-top: 18px; display: block; }
  .stats { display: flex; gap: 24px; margin-top: 18px; color: var(--text-2); font-size: 13px; }
  .stats b { display: block; color: var(--text); font-size: 18px; font-weight: 500; }
  .warnnote { margin-top: 16px; padding: 10px 12px; border-radius: 12px; background: var(--surface); color: var(--text-2); font-size: 12.5px; line-height: 1.5; }
  .stop { margin-right: auto; color: var(--danger); }
  .pop { position: fixed; z-index: 25; width: 340px; background: var(--panel); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow); padding: 14px; }
  .pop h3 { margin: 0 0 2px; font-size: 14px; }
  .pop .select { width: 100%; height: 40px; border-radius: 8px; border: 1px solid var(--border); background: var(--panel); color: var(--text); padding: 0 10px; font: inherit; margin-top: 6px; }
  .pop-layer { position: fixed; inset: 0; z-index: 24; }
  .drawer-scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 30; }
  .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(380px, 100%); background: var(--panel); z-index: 31; box-shadow: var(--shadow); padding: 20px 22px; overflow: auto; }
  .drawer .big { height: 150px; border-radius: 14px; margin: 14px 0 6px; }
  .radio { display: flex; align-items: center; gap: 10px; padding: 9px 4px; cursor: pointer; border-radius: 8px; }
  .radio:hover { background: var(--hover); }
  .timeline { margin: 8px 0 0; padding: 0; list-style: none; color: var(--text-2); font-size: 13px; }
  .timeline li { padding: 6px 0; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; }

  .switcher { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 99; display: flex; align-items: center; gap: 6px; background: #111; color: #fff; border-radius: 28px; padding: 6px 8px; box-shadow: 0 6px 24px rgba(0,0,0,.4); font: 13px system-ui; }
  .switcher button { background: transparent; color: #fff; border: 0; width: 34px; height: 34px; border-radius: 50%; cursor: pointer; font-size: 16px; }
  .switcher button:hover { background: rgba(255,255,255,.15); }
  .switcher span { min-width: 230px; text-align: center; padding: 0 6px; }
</style>
</head>
<body>

<div class="proto-top">Prototype · bỏ đi sau khi chọn · phần "form chia sẻ" có 3 biến thể (thanh dưới cùng)</div>
<div class="stage" id="stage"></div>
<div id="layer"></div>
<div id="toast-host"></div>

<div class="switcher">
  <button id="prev" aria-label="Biến thể trước">←</button>
  <span id="vlabel"></span>
  <button id="next" aria-label="Biến thể sau">→</button>
</div>

<script>
/* ---------------- data (in memory only) ---------------- */
const svg = (d, s = 16, extra = '') => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ${extra}>${d}</svg>`;
const ICON = {
  users: (s = 17) => svg('<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>', s),
  pencil: (s = 15) => svg('<path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>', s),
  more: '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>',
  star: svg('<path d="m12 2 3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1Z"/>', 18, 'class="star"'),
  x: svg('<path d="M18 6 6 18M6 6l12 12"/>', 20),
  copy: svg('<rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>'),
  link: svg('<path d="M10 13a5 5 0 0 0 7.07 0l3-3a5 5 0 0 0-7.07-7.07l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.07 0l-3 3a5 5 0 0 0 7.07 7.07l1.7-1.7"/>'),
  share: svg('<circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/>', 18),
  vault: svg('<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="12" cy="12" r="3"/>', 18),
  trash: svg('<path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/>', 18),
  grid: svg('<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>', 20),
  list: svg('<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>', 20),
};
const EXPIRY = [{ v: 'never', label: 'Không hết hạn' }, { v: '1', label: '1 ngày' }, { v: '7', label: '7 ngày' }, { v: '30', label: '30 ngày' }];
const newToken = () => Array.from(crypto.getRandomValues(new Uint8Array(24)), (b) => 'abcdefghijkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789'[b % 56]).join('');
const share = (expiry, downloads, last) => ({ token: newToken(), expiry, downloads, last });
let files = [
  { id: 'a', name: 'IMG_2041.jpg', kind: 'image', size: '3,2 MB', when: '2 giờ trước', g: 'g1', share: null },
  { id: 'b', name: 'IMG_2058.jpg', kind: 'image', size: '2,8 MB', when: '2 giờ trước', g: 'g4', share: share('never', 3, '12 phút trước') },
  { id: 'c', name: 'Hop-dong-thue-nha.pdf', kind: 'file', size: '812 KB', when: 'Hôm qua', g: 'g2', share: share('7', 1, 'hôm qua') },
  { id: 'd', name: 'IMG_1990.png', kind: 'image', size: '1,1 MB', when: 'Hôm qua', g: 'g5', share: null },
  { id: 'e', name: 'ban-ve-v3.zip', kind: 'file', size: '48 MB', when: '3 ngày trước', g: 'g3', share: null },
  { id: 'f', name: 'Bao-cao-Q3.xlsx', kind: 'file', size: '240 KB', when: '5 ngày trước', g: 'g6', share: share('30', 0, 'chưa có ai mở') },
];
const S = { variant: 'A', view: 'list', sharedOnly: false, tab: null, menu: null, dlg: null, anchor: null, pickExp: 'never', toast: null };
const NAMES = { A: 'Hộp thoại giữa màn hình', B: 'Popover gắn vào icon', C: 'Ngăn trượt bên phải' };
const f = (id) => files.find((x) => x.id === id);
const url = (sh) => 'fatup.example.workers.dev/s/' + sh.token;
const expText = (sh) => (sh.expiry === 'never' ? 'không hết hạn' : `hết hạn sau ${sh.expiry} ngày`);
const tip = (x) => `Đang chia sẻ · ${expText(x.share)} · ${x.share.downloads} lượt tải`;
const $ = (s, r = document) => r.querySelector(s);
const h = (html) => { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstChild; };

/* ---------------- actions ---------------- */
function toast(msg) { S.toast = msg; render(); clearTimeout(toast.t); toast.t = setTimeout(() => { S.toast = null; render(); }, 3400); }
function copy(x) { try { navigator.clipboard.writeText('https://' + url(x.share)); } catch {} toast('Đã sao chép link'); }
function startShare(x, expiry) { x.share = share(expiry, 0, 'chưa có ai mở'); copy(x); }
function stopShare(x) { x.share = null; S.dlg = null; toast('Đã dừng chia sẻ. Link cũ không còn mở được'); }
function moveAway(x, where) {
  const was = !!x.share; S.menu = null; S.dlg = null;
  files = files.filter((y) => y !== x); // it leaves the main list, like the real app; its link dies with it
  toast(was ? `Đã chuyển vào ${where}. Link chia sẻ của file này đã hết hiệu lực` : `Đã chuyển vào ${where}`);
}

/* ---------------- dashboard ---------------- */
function visible() { return files.filter((x) => (!S.sharedOnly || x.share) && (!S.tab || x.kind === S.tab)); }
const count = (k) => files.filter((x) => x.kind === k && (!S.sharedOnly || x.share)).length;
function island() {
  const sharedN = files.filter((x) => x.share).length;
  const tab = (id, label, n) => `<button class="chip chip--site ${S.tab === id ? 'chip--on' : ''}" aria-pressed="${S.tab === id}" data-tab="${id}">${label}<span class="chip__count">${n}</span></button>`;
  return `<div class="chips-row island">
    <div class="chips-left">
      <button class="chip chip--icon chip--important" title="Chỉ file quan trọng">${ICON.star}</button>
      <span class="chips-divider" aria-hidden="true"></span>
      <button class="chip chip--shared ${S.sharedOnly ? 'chip--on' : ''}" aria-pressed="${S.sharedOnly}" data-sharedonly>${ICON.users(16)} Đã chia sẻ<span class="chip__count">${sharedN}</span></button>
      <span class="chips-divider" aria-hidden="true"></span>
      <nav class="chips kind-tabs">${tab('image', 'Ảnh', count('image'))}${tab('file', 'File', count('file'))}${tab('link', 'Liên kết', 0)}</nav>
    </div>
    <div class="chips-row__tools">
      <button class="icon-btn" data-view="${S.view === 'list' ? 'grid' : 'list'}" aria-label="Đổi chế độ xem">${S.view === 'list' ? ICON.grid : ICON.list}</button>
    </div>
  </div>`;
}
const shareBtn = (x) => `<button class="icon-btn icon-btn--sm share-btn" data-open-share="${x.id}" data-tip="${tip(x)}" aria-label="Quản lý chia sẻ">${ICON.users(17)}</button>`;
const renameBtn = `<button class="icon-btn icon-btn--sm rename-btn" aria-label="Đổi tên">${ICON.pencil()}</button>`;
function listHTML(items) {
  const rows = items.map((x) => `
    <div class="list__row" role="row" data-id="${x.id}">
      <span><input type="checkbox" aria-label="Chọn" /></span>
      <span class="col-important" style="display:flex;justify-content:center">${ICON.star}</span>
      <span class="list__name"><span class="list__mini ${x.g}"></span><span class="ellipsis">${x.name}</span></span>
      <span class="col-actions">${x.share ? shareBtn(x) : ''}${renameBtn}</span>
      <span class="muted col-time">${x.when}</span>
      <span class="muted col-size">${x.size}</span>
      <span><button class="icon-btn icon-btn--sm" data-more="${x.id}" aria-label="Thêm">${ICON.more}</button></span>
    </div>`).join('');
  return `<div class="list list--actions" role="table">
    <div class="list__row list__row--head" role="row"><span></span><span></span><span>Tên</span><span class="col-actions"></span><span>Tải lên</span><span class="col-size">Dung lượng</span><span></span></div>
    ${rows}</div>`;
}
function gridHTML(items) {
  return `<div class="grid" style="margin-top:12px">${items.map((x) => `
    <div class="tile" data-id="${x.id}">
      <div class="tile__head">
        <span class="col-important" style="display:flex">${ICON.star}</span>
        <span class="tile__name" style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500">${x.name}</span>
        ${x.share ? `<span class="tile__shared">${shareBtn(x)}</span>` : ''}
        <span class="tile__actions">${renameBtn}</span>
        <button class="icon-btn icon-btn--sm" data-more="${x.id}" aria-label="Thêm">${ICON.more}</button>
      </div>
      <div class="tile__thumb"><div class="${x.g}"></div></div>
    </div>`).join('')}</div>`;
}
function dashboard() {
  const items = visible();
  const body = items.length === 0
    ? `<div class="empty">${S.sharedOnly ? 'Chưa có file nào đang chia sẻ. Dùng ⋮ → Chia sẻ… trên một file.' : 'Không có gì ở đây.'}</div>`
    : S.view === 'list' ? listHTML(items) : gridHTML(items);
  return island() + body +
    `<p class="hint">Thử: ① bấm <b>Đã chia sẻ</b> ở island; ② rê chuột vào icon <span style="color:var(--success)">${ICON.users(14)}</span> để thấy tooltip bên trái, bấm để mở form; ③ <span class="kbd">⋮</span> → <b>Chia sẻ…</b> trên một file chưa chia sẻ; ④ chuyển một file đang chia sẻ vào Két sắt; ⑤ đổi sang lưới bằng nút bên phải island.</p>`;
}

/* ---------------- menu + share forms ---------------- */
function menuHTML() {
  const x = f(S.menu.id);
  return `<div class="menu-layer" data-close><div class="menu" style="left:${S.menu.x}px; top:${S.menu.y}px">
    <button data-act="open">Tải về</button>
    <button data-act="share">${ICON.share} ${x.share ? 'Quản lý chia sẻ…' : 'Chia sẻ…'}</button>
    <button data-act="rename">${ICON.pencil(18)} Đổi tên</button>
    <hr/>
    <button data-act="vault">${ICON.vault} Chuyển vào Két sắt</button>
    <button data-act="trash" class="menu__danger">${ICON.trash} Chuyển vào thùng rác</button>
  </div></div>`;
}
const expiryChips = (x) => `<div class="opts">${EXPIRY.map((e) => `<button class="chip ${x.share.expiry === e.v ? 'chip--on' : ''}" data-exp="${e.v}">${e.label}</button>`).join('')}</div>`;
const note = `<p class="warnnote">Ai có link đều xem và tải được, không cần đăng nhập. Link hết hiệu lực ngay khi bạn dừng chia sẻ, hoặc chuyển file vào Két sắt hoặc thùng rác. Lấy file ra lại thì phải tạo link mới.</p>`;

function dialogA(x) {
  return `<div class="scrim" data-close><div class="dialog dialog--wide" role="dialog">
    <header class="dialog__header"><h2>Chia sẻ “${x.name}”</h2><button class="icon-btn" data-close>${ICON.x}</button></header>
    ${x.share ? `
      <p class="dialog__body" style="margin:0">Bất kỳ ai có link đều xem và tải về được.</p>
      <div class="linkbox"><input readonly value="https://${url(x.share)}" /><button class="btn btn--filled" data-copy>${ICON.copy} Sao chép</button></div>
      <span class="lbl">Hết hạn sau</span>${expiryChips(x)}
      <div class="stats"><div><b>${x.share.downloads}</b>lượt tải</div><div><b>${x.share.last}</b>lần mở gần nhất</div></div>
      ${note}
      <div class="row row--end"><button class="btn btn--text stop" data-stop>Dừng chia sẻ</button><button class="btn btn--text" data-close>Xong</button></div>`
    : `
      <p class="dialog__body" style="margin:0">Tạo một link để gửi cho người khác. Họ chỉ xem và tải về, không sửa hay xóa được.</p>
      <span class="lbl">Hết hạn sau</span>
      <div class="opts">${EXPIRY.map((e) => `<button class="chip ${S.pickExp === e.v ? 'chip--on' : ''}" data-pick="${e.v}">${e.label}</button>`).join('')}</div>
      <div class="row row--end"><button class="btn btn--text" data-close>Hủy</button><button class="btn btn--filled" data-create>${ICON.link} Tạo link và sao chép</button></div>`}
  </div></div>`;
}
function popB(x) {
  const a = S.anchor || { left: 400, bottom: 200 };
  const left = Math.max(8, Math.min(a.left - 300, innerWidth - 356)), top = Math.min(a.bottom + 6, innerHeight - 330);
  return `<div class="pop-layer" data-close></div><div class="pop" style="left:${left}px; top:${top}px">
    <h3>${x.share ? 'Đang chia sẻ' : 'Chia sẻ file này'}</h3>
    ${x.share ? `
      <div class="linkbox" style="margin-top:10px"><input readonly value="https://${url(x.share)}" /><button class="btn btn--filled" data-copy style="padding:0 14px">${ICON.copy}</button></div>
      <select class="select" data-expsel>${EXPIRY.map((e) => `<option value="${e.v}" ${x.share.expiry === e.v ? 'selected' : ''}>Hết hạn: ${e.label.toLowerCase()}</option>`).join('')}</select>
      <div style="display:flex; align-items:center; margin-top:12px; color:var(--text-2); font-size:12.5px"><span>${x.share.downloads} lượt tải · mở lần cuối ${x.share.last}</span><button class="btn btn--text" data-stop style="margin-left:auto; color:var(--danger)">Dừng</button></div>`
    : `
      <p class="dialog__body" style="margin:6px 0 10px; font-size:13px">Link công khai, chỉ xem và tải về.</p>
      <select class="select" data-picksel>${EXPIRY.map((e) => `<option value="${e.v}">Hết hạn: ${e.label.toLowerCase()}</option>`).join('')}</select>
      <div class="row row--end" style="margin-top:12px"><button class="btn btn--text" data-close>Hủy</button><button class="btn btn--filled" data-create>Tạo link</button></div>`}
  </div>`;
}
function drawerC(x) {
  const on = !!x.share;
  return `<div class="drawer-scrim" data-close></div><aside class="drawer">
    <div style="display:flex; align-items:center"><h2 style="margin:0; font-size:18px; font-weight:500">Chia sẻ</h2><button class="icon-btn" data-close style="margin-left:auto">${ICON.x}</button></div>
    <div class="big ${x.g}"></div>
    <div style="font-weight:500; word-break:break-all">${x.name}</div><div style="color:var(--text-3); font-size:13px">${x.size}</div>
    <span class="lbl">Ai mở được link</span>
    <div style="margin-top:6px; color:var(--text-2); font-size:13px">Bất kỳ ai có link · chỉ xem và tải về</div>
    <span class="lbl">Thời hạn</span>
    ${EXPIRY.map((e) => `<label class="radio"><input type="radio" name="exp" value="${e.v}" ${(on ? x.share.expiry : S.pickExp) === e.v ? 'checked' : ''} data-radio /> ${e.label}</label>`).join('')}
    ${on ? `
      <div class="linkbox"><input readonly value="https://${url(x.share)}" /><button class="btn btn--filled" data-copy>${ICON.copy}</button></div>
      <span class="lbl">Hoạt động</span>
      <ul class="timeline"><li><span>Lượt tải</span><b>${x.share.downloads}</b></li><li><span>Mở lần cuối</span><b>${x.share.last}</b></li></ul>
      ${note}
      <div class="row"><button class="btn btn--outlined" data-stop>Dừng chia sẻ</button></div>`
    : `${note}<div class="row"><button class="btn btn--filled" data-create style="width:100%; justify-content:center">${ICON.link} Tạo link và sao chép</button></div>`}
  </aside>`;
}

/* ---------------- render + events ---------------- */
function render() {
  $('#stage').innerHTML = dashboard();
  const layer = $('#layer'); layer.innerHTML = '';
  if (S.menu) layer.append(h(menuHTML()));
  if (S.dlg && f(S.dlg)) {
    const x = f(S.dlg);
    layer.append(h('<div>' + (S.variant === 'A' ? dialogA(x) : S.variant === 'B' ? popB(x) : drawerC(x)) + '</div>'));
  }
  $('#toast-host').innerHTML = S.toast ? `<div class="toast" style="position:fixed; left:50%; bottom:80px; transform:translateX(-50%); z-index:200">${S.toast}</div>` : '';
  $('#vlabel').textContent = `${S.variant} — ${NAMES[S.variant]}`;
  history.replaceState(null, '', '?variant=' + S.variant);
}
function openShare(id, el) { S.dlg = id; S.menu = null; S.pickExp = 'never'; if (el) S.anchor = el.getBoundingClientRect(); }
document.addEventListener('click', (e) => {
  const t = e.target.closest('button,[data-close],[data-id]');
  if (!t) return;
  const x = S.dlg ? f(S.dlg) : null;
  if (t.hasAttribute('data-sharedonly')) { S.sharedOnly = !S.sharedOnly; return render(); }
  if (t.dataset.tab) { S.tab = S.tab === t.dataset.tab ? null : t.dataset.tab; return render(); }
  if (t.dataset.view) { S.view = t.dataset.view; return render(); }
  if (t.dataset.openShare) { openShare(t.dataset.openShare, t); return render(); }
  if (t.dataset.more) { const r = t.getBoundingClientRect(); S.anchor = r; S.menu = { id: t.dataset.more, x: Math.min(r.left - 170, innerWidth - 230), y: r.bottom }; return render(); }
  if (t.dataset.act) {
    const y = f(S.menu.id);
    if (t.dataset.act === 'share') openShare(y.id, null);
    else if (t.dataset.act === 'vault') moveAway(y, 'Két sắt');
    else if (t.dataset.act === 'trash') moveAway(y, 'thùng rác');
    else S.menu = null;
    return render();
  }
  if (t.hasAttribute('data-close')) { if (t.tagName === 'BUTTON' || t === e.target) { S.menu = null; S.dlg = null; render(); } return; }
  if (t.hasAttribute('data-copy')) return copy(x);
  if (t.hasAttribute('data-stop')) return stopShare(x), render();
  if (t.hasAttribute('data-create')) { startShare(x, S.pickExp); return render(); }
  if (t.dataset.pick) { S.pickExp = t.dataset.pick; return render(); }
  if (t.dataset.exp) { x.share.expiry = t.dataset.exp; render(); return toast('Đã đổi hạn: ' + EXPIRY.find((q) => q.v === t.dataset.exp).label.toLowerCase()); }
});
document.addEventListener('change', (e) => {
  const x = S.dlg ? f(S.dlg) : null;
  if (e.target.matches('[data-radio]')) { if (x.share) { x.share.expiry = e.target.value; render(); toast('Đã đổi hạn'); } else S.pickExp = e.target.value; return; }
  if (e.target.matches('[data-expsel]')) { x.share.expiry = e.target.value; render(); toast('Đã đổi hạn'); return; }
  if (e.target.matches('[data-picksel]')) S.pickExp = e.target.value;
});
function go(d) { const k = ['A', 'B', 'C']; S.variant = k[(k.indexOf(S.variant) + d + 3) % 3]; render(); }
$('#prev').onclick = () => go(-1); $('#next').onclick = () => go(1);
document.addEventListener('keydown', (e) => {
  if (/input|textarea|select/i.test(document.activeElement.tagName)) return;
  if (e.key === 'ArrowLeft') go(-1); if (e.key === 'ArrowRight') go(1);
  if (e.key === 'Escape') { S.menu = null; S.dlg = null; render(); }
});
const q = new URLSearchParams(location.search).get('variant');
if (['A', 'B', 'C'].includes(q)) S.variant = q;
render();
</script>
</body>
</html>
